<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piksel Edits | Профессиональный видеомонтаж</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent-neon: #00f0ff;
            --accent-pink: #ff007f;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
            --border-color: rgba(0, 240, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.05) 0%, transparent 40%);
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            margin: 30px 0 20px;
            color: var(--accent-neon);
            border-left: 4px solid var(--accent-pink);
            padding-left: 10px;
        }

        /* Тарифтер */
        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-neon);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }

        .card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-pink);
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(45deg, var(--accent-neon), #0077ff);
            color: #000;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 10px var(--accent-neon);
        }
